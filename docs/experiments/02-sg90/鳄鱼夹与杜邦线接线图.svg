<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750" role="img" aria-labelledby="title desc">
<title id="title">单颗SG90：USB鳄鱼夹与五根杜邦线接线图</title>
<desc id="desc">独立5V充电器红夹经D2给舵机正极供电，黑夹经D4接面包板共地孔组，D3接舵机负极，D5接开发板GND，GPIO17经D1接舵机信号。开发板另用电脑USB供电。</desc>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1e293b;font-size:17px}.heading{font-size:23px;font-weight:600}.small{font-size:15px}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ground{stroke:#334155}.red{stroke:#dc2626}.signal{stroke:#d97706}.note{fill:#475569}</style>
<rect width="1120" height="750" fill="#fff"/>
<text x="40" y="40" class="heading">单颗SG90历史实验 · 鳄鱼夹＋杜邦线</text>
<rect x="40" y="80" width="260" height="140" rx="10" class="box"/>
<text x="60" y="110">独立5V USB充电器</text>
<text x="60" y="140" class="small">USB转红黑鳄鱼夹供电线</text>
<text x="60" y="175" class="small">红夹＝＋5V　黑夹＝GND</text>
<rect x="850" y="80" width="230" height="220" rx="10" class="box"/>
<text x="870" y="110">SG90原三孔母插头</text>
<text x="870" y="152">红线：＋5V</text>
<text x="870" y="207">棕/黑线：GND</text>
<text x="870" y="262">橙/黄线：信号</text>
<text x="870" y="290" class="small">按线色认孔，不凭插头朝向猜</text>
<rect x="40" y="420" width="260" height="150" rx="10" class="box"/>
<text x="60" y="452">ESP32-S3开发板</text>
<text x="60" y="490">GPIO17</text>
<text x="60" y="545">GND</text>
<path d="M40 600 H170 V570" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="40" y="630">电脑USB数据线 → 开发板</text>
<rect x="365" y="305" width="225" height="90" rx="10" fill="#eff6ff" stroke="#94a3b8"/>
<text x="380" y="333">面包板：同一导通孔组B</text>
<path d="M300 150 H850" class="wire red"/>
<rect x="320" y="141" width="32" height="18" rx="3" fill="#dc2626"/>
<text x="390" y="133">红鳄鱼夹 → D2杜邦线 → 红线孔</text>
<path d="M300 195 H410 V365" class="wire ground"/>
<rect x="320" y="186" width="32" height="18" rx="3" fill="#334155"/>
<text x="430" y="235">D4：黑夹 → B点</text>
<path d="M410 365 H550" class="wire ground"/>
<circle cx="410" cy="365" r="7" fill="#334155"/>
<circle cx="480" cy="365" r="7" fill="#334155"/>
<circle cx="550" cy="365" r="7" fill="#334155"/>
<path d="M550 365 H785 V205 H850" class="wire ground"/>
<text x="605" y="348">D3：B点 → 舵机地线孔</text>
<path d="M300 540 H480 V365" class="wire ground"/>
<text x="495" y="520">D5：开发板GND → B点</text>
<path d="M300 485 H680 V260 H850" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
<path d="M300 485 H680 V260 H850" class="wire signal"/>
<text x="325" y="464">D1：GPIO17 → 舵机信号孔</text>
<text x="710" y="435" class="small">交叉无点：不连接</text>
<text x="365" y="415" class="small">三孔示意，不是原实物孔号</text>
<path d="M40 660 H1080" stroke="#cbd5e1"/>
<text x="40" y="691">公针插入舵机母孔；鳄鱼夹夹杜邦公针金属部分，两夹固定隔离。</text>
<text x="40" y="720" class="note">外部＋5V不接开发板5V或3V3；只将GND共地。此图用于单颗轻载恢复，不作四舵机供电板接线图。</text>
</svg>
